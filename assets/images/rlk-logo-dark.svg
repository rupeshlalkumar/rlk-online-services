<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="rlk-orange-grad-dk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3b" />
      <stop offset="100%" stop-color="#fb8d2e" />
    </linearGradient>
    <linearGradient id="rlk-green-grad-dk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46be4c" />
      <stop offset="100%" stop-color="#3aa540" />
    </linearGradient>
    <linearGradient id="rlk-azure-grad-dk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22bcf6" />
      <stop offset="100%" stop-color="#04abed" />
    </linearGradient>
    <linearGradient id="rlk-swoosh-grad-dk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcca0a" />
      <stop offset="48%" stop-color="#3aa540" />
      <stop offset="100%" stop-color="#04abed" />
    </linearGradient>
    <filter id="subtle-glow-dk" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Deep Black/Obsidian Canvas Matching 02 Main Logo.png -->
  <circle cx="250" cy="250" r="236" fill="#0b0f17" filter="url(#subtle-glow-dk)" />

  <!-- Four Quadrant Brand Border Ring (16px stroke) -->
  <!-- Top-Right Quadrant: Green -->
  <path d="M 250 14 A 236 236 0 0 1 486 250" fill="none" stroke="#3aa540" stroke-width="16" stroke-linecap="butt" />
  <!-- Bottom-Right Quadrant: Vivid Azure -->
  <path d="M 486 250 A 236 236 0 0 1 250 486" fill="none" stroke="#04abed" stroke-width="16" stroke-linecap="butt" />
  <!-- Bottom-Left Quadrant: Yellow -->
  <path d="M 250 486 A 236 236 0 0 1 14 250" fill="none" stroke="#fcca0a" stroke-width="16" stroke-linecap="butt" />
  <!-- Top-Left Quadrant: Orange -->
  <path d="M 14 250 A 236 236 0 0 1 250 14" fill="none" stroke="#fb8d2e" stroke-width="16" stroke-linecap="butt" />

  <!-- Monogram RLK Artwork -->
  <g id="rlk-letters-dark">
    <!-- Letter R: Orange Gradient -->
    <path d="M 52 148 L 226 148 L 198 186 L 112 186 L 112 222 L 204 222 C 224 222 238 236 238 256 C 238 274 224 288 202 288 L 150 288 L 112 288 L 112 355 L 75 355 L 75 186 L 52 186 Z" fill="url(#rlk-orange-grad-dk)" />
    <polygon points="144,288 214,355 304,355 264,324 214,324 180,288" fill="url(#rlk-orange-grad-dk)" />

    <!-- Letter L: Green Gradient -->
    <path d="M 225 133 L 262 133 L 262 280 L 340 316 L 305 354 L 225 354 Z" fill="url(#rlk-green-grad-dk)" />

    <!-- Letter K: Vivid Azure Gradient -->
    <polygon points="357,148 418,148 308,258 275,236 357,148" fill="url(#rlk-azure-grad-dk)" />
    <path d="M 275 236 L 332 290 L 434 342 L 378 342 L 302 290 L 275 236 Z" fill="url(#rlk-azure-grad-dk)" />

    <!-- Underline Swoosh: Yellow -> Green -> Vivid Azure -->
    <path d="M 125 400 C 230 384 340 356 430 356 C 350 366 240 395 125 400 Z" fill="url(#rlk-swoosh-grad-dk)" />
  </g>
</svg>
